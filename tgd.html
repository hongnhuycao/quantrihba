.khb-bank{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.khb-bank .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.khb-bank .hd a{color:var(--brand);font-weight:800;text-decoration:none;font-size:15px}.khb-bank .hd b{font-size:15px}
.khb-bank .hd .sub{font-size:12px;font-variant-numeric:tabular-nums}
.khb-bank .k{font-size:12px;color:var(--ink3);font-weight:600;margin-top:2px}
.khb-bank .v{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.khb-bank .r{display:flex;justify-content:space-between;gap:8px;font-size:13px}.khb-bank .r span{color:var(--ink2)}.khb-bank .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.khb-bank .r.end{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.khb-bank .r.end b{font-size:15px}
.khb-bank.tot{background:var(--brand-soft);border-color:var(--brand)}
.bar3{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);gap:1px;margin:2px 0}.bar3 i{display:block;height:100%}
.bar3 .p,.khb-leg .p{background:var(--out)}.bar3 .w,.khb-leg .w{background:var(--out);opacity:.35}.bar3 .l,.khb-leg .l{background:var(--in)}
.khb-leg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}.khb-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.khb-baled{padding:0}.khb-baled>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px}.khb-baled>summary::-webkit-details-marker{display:none}
.khb-baled>summary b::before{content:"▸ ";color:var(--ink3)}.khb-baled[open]>summary b::before{content:"▾ "}
.khb-baled[open]{padding-bottom:12px}.khb-baled .r,.khb-baled .hint{margin:0 16px}
.khb-done>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px}.khb-done>summary::-webkit-details-marker{display:none}
.khb-done>summary b::before{content:"▸ ";color:var(--ink3)}.khb-done[open]>summary b::before{content:"▾ "}.khb-done[open]>summary{border-bottom:1px solid var(--line)}
.khb-bot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
@media (max-width:700px){.khb-bot{grid-template-columns:1fr}}
.khb-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,.85fr);gap:10px}
@media (max-width:900px){.khb-top{grid-template-columns:repeat(2,minmax(0,1fr))}.khb-pie{grid-column:1/-1}}
@media (max-width:600px){.khb-top{grid-template-columns:1fr}}
.khb-sum{padding:14px 16px;display:flex;flex-direction:column;gap:9px;background:var(--brand-soft);border-color:var(--brand)}
.khb-sum h3{margin:0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.khb-sum .r{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.khb-sum .r span{color:var(--ink2);font-weight:600}
.khb-sum .r b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.khb-sum input.money-in{max-width:190px;text-align:right;font-size:17px!important;padding:7px 10px}
.khb-sum .r.bk span{padding-left:10px;font-weight:500}.khb-sum .r.bk input.money-in{font-size:15px!important;padding:6px 10px}
.khb-sum .end{border-top:1px solid var(--line);padding-top:9px}.khb-sum .end b{font-size:21px}
.khb-sum .hint{font-size:11.5px;color:var(--ink3);text-align:right;margin-top:-5px}
.khb-cat{padding:12px 14px;min-width:0}
.khb-cat table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.khb-cat th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 4px 4px}
.khb-cat th.in{color:var(--in)}.khb-cat th.out{color:var(--out)}
.khb-cat td{padding:5px 4px;border-top:1px dashed var(--line)}
.khb-cat td.n{text-align:right;white-space:nowrap}
.khb-cat button{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.khb-cat button:hover{color:var(--brand);text-decoration:underline}
.khb-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
.khb-pct{display:inline-block;min-width:42px;padding:1px 6px;border-radius:6px;font-weight:700;font-size:12px;text-align:center;background:var(--soft)}
.khb-pie{padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.khb-pie svg{width:100%;max-width:210px;height:auto}
.khb-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.khb-tools .seg{flex:0 1 260px}
.khb-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0}
.khb-t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:780px;font-variant-numeric:tabular-nums}
.khb-t th{font-size:11.5px;color:var(--ink3);font-weight:700;text-align:left;padding:9px 8px;background:var(--bg);border-bottom:1px solid var(--line);white-space:nowrap}
.khb-t th.n,.khb-t td.n{text-align:right;white-space:nowrap}
.khb-t td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.khb-t td:first-child,.khb-t th:first-child{width:34px;text-align:center}
.khb-t tr.off td{opacity:.42}.khb-t tr.off td:first-child{opacity:1}
.khb-t tr.ck{cursor:pointer}.khb-t tr.ck:hover td{background:var(--bg)}
.khb-t input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer}
.khb-t .grp td{background:var(--soft);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.khb-t .grp.in td{color:var(--in)}.khb-t .grp.out td{color:var(--out)}
.khb-t .sub2 td{background:var(--bg);font-weight:700}
.khb-t tfoot td{font-weight:800;background:var(--bg);border-top:2px solid var(--line)}
.khb-t td small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.khb-t .neg{color:var(--bad);font-weight:700}
.khb-act{margin-top:5px;border:1px solid var(--brand);background:var(--card);border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;font-weight:700;color:var(--brand);cursor:pointer}.khb-act:hover{background:var(--brand-soft)}
.khb-chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;white-space:nowrap}
.khb-catf{padding:14px;display:flex;flex-direction:column;gap:10px}
.khb-catf .row{display:flex;gap:8px;flex-wrap:wrap}.khb-catf .row input{flex:1 1 200px;width:auto}.khb-catf .row select{width:auto}
.khb-cus{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.khb-cus span{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}

/* ===== GIAO DIỆN HÒA BÌNH ARCHITECTS ===== */
/* Màu chủ đạo: xanh logo Hòa Bình. Nền giấy bản vẽ (lưới kỹ thuật), dấu góc bản vẽ trên thẻ, đường kích thước dưới tiêu đề. */
:root:not([data-theme="dark"]){
  --bg:#edf2f8; --card:#ffffff; --soft:#e5ecf5; --line:#d0dcea;
  --ink:#0d1d31; --ink2:#41546b; --ink3:#63758b;
  --brand:#0b58a6; --brand-ink:#ffffff; --brand-soft:#e1ecf9; --brand-deep:#073d76;
  --wait:#2f6f95; --wait-soft:#e2eef5;
  --field:#f6faff; --field-line:#b7cde5;
  --grid:rgba(11,88,166,.055); --grid2:rgba(11,88,166,.09); --tick:rgba(11,88,166,.45);
  --shadow:0 1px 2px rgba(7,61,118,.06),0 6px 18px rgba(7,61,118,.06);
  --fd:"Barlow Condensed","Be Vietnam Pro",system-ui,sans-serif; --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121f; --card:#0e1c2f; --soft:#15283e; --line:#223853;
  --ink:#e6eef8; --ink2:#a7b9cd; --ink3:#8598ae;
  --brand:#62a6ee; --brand-ink:#04152a; --brand-soft:#112a49; --brand-deep:#0a2b54;
  --wait:#7cbde3; --wait-soft:#122a3b;
  --field:#0b192b; --field-line:#2d4b70;
  --grid:rgba(98,166,238,.06); --grid2:rgba(98,166,238,.1); --tick:rgba(98,166,238,.5);
  --shadow:none; --fd:"Barlow Condensed","Be Vietnam Pro",system-ui,sans-serif; --r:8px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121f; --card:#0e1c2f; --soft:#15283e; --line:#223853;
  --ink:#e6eef8; --ink2:#a7b9cd; --ink3:#8598ae;
  --brand:#62a6ee; --brand-ink:#04152a; --brand-soft:#112a49; --brand-deep:#0a2b54;
  --wait:#7cbde3; --wait-soft:#122a3b;
  --field:#0b192b; --field-line:#2d4b70;
  --grid:rgba(98,166,238,.06); --grid2:rgba(98,166,238,.1); --tick:rgba(98,166,238,.5);
  --shadow:none; --fd:"Barlow Condensed","Be Vietnam Pro",system-ui,sans-serif; --r:8px; color-scheme:dark}

/* nền giấy bản vẽ */
body{background-color:var(--bg);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px;background-attachment:fixed}

/* đầu trang */
.top{background:var(--card);border-bottom:0;box-shadow:0 2px 0 var(--brand),0 6px 20px rgba(7,61,118,.08)}
.top-in{position:relative;isolation:isolate;padding-block:12px}
.ttl{position:relative;isolation:isolate}

556 138V60l18-10 18 10v78M556 72h36M556 84h36M556 96h36M556 108h36M556 120h36M574 50v88%22/%3E %3Cpath d=%22M604 138V86h26v52M604 98h26M604 110h26M604 122h26M617 86v52%22/%3E %3C/svg%3E") right bottom/contain no-repeat}
.hba-logo{display:flex;align-items:center;flex:none;padding-right:14px;margin-right:2px;border-right:1px solid var(--line)}
.hba-logo img{display:block;height:44px;width:auto}
.hba-logo .lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hba-logo .lg-l{display:none}:root:not([data-theme="light"]) .hba-logo .lg-d{display:block}}
:root[data-theme="dark"] .hba-logo .lg-l{display:none}:root[data-theme="dark"] .hba-logo .lg-d{display:block}
.ttl b{font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.ttl span{font-size:11.5px;letter-spacing:.02em}
@media (max-width:759px){.hba-logo img{height:32px}.hba-logo{padding-right:10px}.ttl b{font-size:16px;letter-spacing:.1em}.ttl::after{display:none}}
.top-in .roles button{border-radius:4px;font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.top-in .roles button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.top-in .propose{border-radius:4px}
.icon-btn{border-radius:6px;color:var(--brand);border-color:var(--field-line)}
.icon-btn:hover{background:var(--brand-soft)}

/* thanh màn hình con: dải xanh đậm */
.subbar{background:var(--brand-deep);border-top:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:16px 16px}
.subtabs .crumb{color:#fff;opacity:.9;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.subtabs .gl,.subtabs .arr{color:rgba(255,255,255,.55)}
.subtabs .grp{border-left-color:rgba(255,255,255,.18)}
.subtabs button{color:rgba(255,255,255,.82);border-radius:4px}
.subtabs button:hover{background:rgba(255,255,255,.1);color:#fff}
.subtabs button[aria-current]{background:#fff;color:#073d76;box-shadow:inset 0 -2px 0 #0b58a6}
.subtabs button .no{background:rgba(255,255,255,.18);color:#fff}
.subtabs button[aria-current] .no{background:#0b58a6;color:#fff}
.subtabs .gr-r .ghi{background:#fff;color:#073d76;font-weight:700}
.subtabs .gr-r .ghi:hover{background:#fff;opacity:.92}
.subtabs .gr-r .ghi[aria-current]{background:#fff;color:#073d76;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.subtabs .gr-r .gear{border-color:rgba(255,255,255,.3);color:#fff}
.subtabs .gr-r .gear[aria-current]{background:#fff;color:#073d76}

/* thanh dưới (điện thoại) */
.bnav{background:var(--brand-deep);border-top:2px solid var(--brand)}
.bnav button{color:rgba(255,255,255,.62)}
.bnav button[aria-current]{color:#fff}
.bnav button[aria-current]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:#fff}

/* tiêu đề: chữ dựng + đường kích thước */
main h1{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;color:var(--brand-deep);padding-bottom:10px;background:linear-gradient(var(--brand),var(--brand)) 0 calc(100% - 3px)/76px 2px no-repeat,linear-gradient(var(--brand),var(--brand)) 0 100%/2px 9px no-repeat,linear-gradient(var(--brand),var(--brand)) 74px 100%/2px 9px no-repeat}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) main h1{color:var(--ink)}}
:root[data-theme="dark"] main h1{color:var(--ink)}
main h2{font-family:var(--fd);font-size:21px;font-weight:600;letter-spacing:.03em;padding-left:15px;background:linear-gradient(var(--brand),var(--brand)) 0 .5em/7px 7px no-repeat,linear-gradient(var(--brand),var(--brand)) 3px 0/1px 100% no-repeat}
main .sec-h{padding-bottom:7px;border-bottom:1px dashed var(--field-line)}
main .card .sec-h{border-bottom:0;padding-bottom:0}
.hubcard h3,.reps h3,.khb-sum h3,.kq-h,.ns-ps h3,.pl-list h3{font-family:var(--fd);letter-spacing:.08em;color:var(--brand)}
.grp-h b{font-family:var(--fd)}

/* thẻ: góc bo nhỏ + dấu góc bản vẽ */
.card{border-color:var(--line);background-image:linear-gradient(var(--tick),var(--tick)),linear-gradient(var(--tick),var(--tick)),linear-gradient(var(--tick),var(--tick)),linear-gradient(var(--tick),var(--tick));background-size:12px 1.5px,1.5px 12px,12px 1.5px,1.5px 12px;background-position:5px 5px,5px 5px,calc(100% - 5px) calc(100% - 5px),calc(100% - 5px) calc(100% - 5px);background-repeat:no-repeat}
.stat{border-radius:var(--r);background-color:var(--card);background-image:linear-gradient(135deg,transparent 0 calc(100% - 26px),var(--brand-soft) calc(100% - 26px))}
.stat .v,.kpi .v,.hero3 .v,.gv-stat .v,.khb-bank .v{font-family:var(--fd);font-weight:700;letter-spacing:.01em;font-size:1.25em}
.kpi .k,.gv-stat .k,.khcat .k,.hero3 .k{text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;font-weight:700}

/* nút, chip, phân đoạn */
.btn{border-radius:6px}
.btn.pri{background:var(--brand);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:not(.pri):not(.in):not(.out):hover{border-color:var(--brand);color:var(--brand)}
.seg{border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.seg button{border-radius:4px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.chipbtn,.gv-proj button,.rolebar button{border-radius:4px}
.chipbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kind,.opt{border-radius:6px}
.kind[aria-pressed="true"],.opt[aria-pressed="true"]{box-shadow:inset 3px 0 0 var(--brand)}
.step-h .no{border-radius:3px;font-family:var(--fd)}
.pill{border-radius:4px}
select,input[type=text],input[type=search],input[type=date],input[type=number],input:not([type]),textarea{border-radius:6px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}

/* bảng: đầu bảng kiểu khung tên bản vẽ */
.sumtbl thead th,.khtbl thead th,.khtbl thead th:first-child,.khb-t th,.kx-pl th,.kx-cf th,.wk-g th,.cv-t thead th,.tr-hm thead th{background:var(--brand-soft);color:var(--brand-deep);text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sumtbl thead th,:root:not([data-theme="light"]) .khtbl thead th,:root:not([data-theme="light"]) .khb-t th,:root:not([data-theme="light"]) .kx-pl th,:root:not([data-theme="light"]) .kx-cf th,:root:not([data-theme="light"]) .wk-g th,:root:not([data-theme="light"]) .cv-t thead th,:root:not([data-theme="light"]) .tr-hm thead th{color:var(--brand)}}
:root[data-theme="dark"] .sumtbl thead th,:root[data-theme="dark"] .khtbl thead th,:root[data-theme="dark"] .khb-t th,:root[data-theme="dark"] .kx-pl th,:root[data-theme="dark"] .kx-cf th,:root[data-theme="dark"] .wk-g th,:root[data-theme="dark"] .cv-t thead th,:root[data-theme="dark"] .tr-hm thead th{color:var(--brand)}
.sumtbl tfoot td,.khb-t tfoot td{border-top:2px solid var(--brand)}
.pcg thead th,.ln-h,.tr-ch{background:var(--brand-soft);color:var(--brand)}

/* dải tiêu đề nhóm (đội, khối, dự án) */
.cv-th,.pc-th,.mx-th{background-color:var(--brand-soft);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:14px 14px;border-bottom:2px solid var(--brand)}
.cv-th h2,.pc-th h2,.mx-th b{font-family:var(--fd);color:var(--brand)}
main .grp-h:has(h2){border-top-color:var(--brand)}
.khb-sum,.khb-bank.tot{border-color:var(--brand);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:14px 14px}

/* sơ đồ quy trình */
.fic{border-radius:6px;border:1.5px solid currentColor}
.fic .bdg{border-radius:4px}

/* chân trang */
.hba-foot{position:relative;isolation:isolate;overflow:hidden;background:var(--brand-deep);color:#fff;margin-top:8px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:20px 20px}

<script>
/* ---------- LINK NHÁNH TGĐ: kết nối Google Sheets "ghi lại – phát lại" ----------
 Chủ app mở link nhánh: app đọc thẳng Google Sheet như link tổng, đồng thời ghi lại các bảng cần cho
 Dự án / Phân công / Nhân sự. Bấm "Cập nhật cho TGĐ" -> đăng các bảng đó thành data.json của link nhánh.
 Người không đăng nhập / không có quyền file (TGĐ): app đọc data.json, chỉ xem, không ghi được gì. */
window.BR=(function(){
 const MAIN="1jsd_dKx4zJAaerH_7gydFbYkM-nIfzX1Znn7hg4id3A",WK="1AcxL3QKN_x9PfEGFEDibV9daDh_Mrvvdm-iF2OSdHlw",HR="1lcZyYSNUoGdEsaYTXqi7rblJw-IzDB5aF7dVIQgHLVE",PLAN="1RIBeQDM3ytuY0wV3aI8WbU6sb51JbA2Okc9JuD7k3dU";
 const HD_RANGE="'HĐ CĐT'!A4:AD1000";
 /* chỉ những bảng này được đưa vào data.json (không có sổ thu chi, đề nghị thanh toán, dòng tiền...) */
 const NEED=[[MAIN,"'Quản trị dự án'!A4:J200"],[MAIN,"'Tên gọi nhân sự'!A4:J300"],[MAIN,HD_RANGE],[WK,"'nhân sự HBA'!A1:Y400"],
  [HR,"'Phep'!A5:Q200"],[HR,"'Import_NghiPhep'!A2:AF5000"],[HR,"'Import_TangCa'!A2:M5000"],[HR,"'ChamCong'!A1:I6000"],[HR,"'importrangeData'!A3:R9000"],[HR,"'Droplist'!C2:N300"],[HR,"'NgayNghi'!A1:B400"],
  [PLAN,"'TỔNG HỢP - DỰ ÁN'!A8:F300"]];
 const K=(id,r)=>id+"|"+r,ALLOW=new Set(NEED.map(n=>K(n[0],n[1])));
 let PUB=null,REC={},real=null,live=false,ro=false,canPub=true,busy=false,T=null;
 /* Bản GitHub: số liệu lấy trực tiếp từ Google Apps Script (chạy bằng tài khoản chủ app), mỗi lần mở là số mới. */
 const API_URL="https://script.google.com/macros/s/AKfycbyOy5O0ZO7AN3XScmxp8ZflWZSu8NqYOR-qd08TCJ1RIY5iS3yUF0xATiiFl8QvwR8N/exec";
 const API_KEY=new URLSearchParams(location.search).get("k")||"";
 let PUB_ERR="",PUB_TXT="";
 function pubFetch(){return fetch(API_URL+"?k="+encodeURIComponent(API_KEY)+"&t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject("http"+r.status));}
 /* Mở là có số ngay: hiện số lần trước lưu trên máy này, đồng thời tải số mới; số mới khác thì tự làm mới trang. */
 const LSK="hba_tgd_"+API_KEY;
 function lsGet(){try{return localStorage.getItem(LSK)}catch(e){return null}}
 function lsSet(t){try{localStorage.setItem(LSK,t)}catch(e){}}
 function lsDel(){try{localStorage.removeItem(LSK)}catch(e){}}
 function applyPub(t){PUB_TXT=t;const d=JSON.parse(t);if(d&&d.error){if(d.error==="bad_key"){try{localStorage.removeItem("hba_pass")}catch(e){}}PUB_ERR=d.error;PUB=null;return false;}PUB=d&&d.rec&&d.at>0?d:null;if(!PUB)PUB_ERR="empty";return !!PUB;}
 const pubNet=pubFetch();
 const pubCached=lsGet();
 let pubFromCache=false;
 if(pubCached){try{pubFromCache=applyPub(pubCached)}catch(e){pubFromCache=false}if(!pubFromCache){PUB=null;PUB_ERR="";lsDel();}}
 const pubReady=pubFromCache?Promise.resolve():pubNet.then(t=>{if(applyPub(t))lsSet(t);}).catch(e=>{PUB_ERR=String(e||"net");});
 if(pubFromCache)pubNet.then(t=>{const d=JSON.parse(t);if(d&&d.error==="bad_key"){lsDel();try{localStorage.removeItem("hba_pass")}catch(e){}location.reload();return;}if(!(d&&d.rec&&d.at>0))return;lsSet(t);if(JSON.stringify(d.rec)!==JSON.stringify(PUB.rec))location.reload();else{PUB_TXT=t;PUB.at=d.at;}}).catch(()=>{});
 /* đang mở trang: 10 phút kiểm tra một lần, số liệu đổi thì tải lại trang */
 setInterval(()=>{if(document.hidden||!PUB)return;pubFetch().then(t=>{if(t!==PUB_TXT){const d=JSON.parse(t);if(d&&d.rec)location.reload();}}).catch(()=>{});},10*60000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PUB&&Date.now()-PUB.at>10*60000)location.reload();});
 function valsOf(res){let p=res&&res.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}return p&&Array.isArray(p.values)?p.values:[];}
 /* HĐ CĐT: chỉ giữ mã, số HĐ, chủ đầu tư, gói thầu, tên công trình — bỏ giá trị hợp đồng */
 function trim(k,v){if(k===K(MAIN,HD_RANGE))return v.map(r=>r.map((c,i)=>[0,2,4,5,19].includes(i)?c:""));return v;}
 function rec(input,res){const k=K(input.spreadsheetId,input.range);if(!ALLOW.has(k))return;REC[k]=trim(k,valsOf(res));clearTimeout(T);T=setTimeout(bar,1500);}
 function fake(input){const v=(PUB&&PUB.rec[K(input.spreadsheetId,input.range)])||[];return {payload:{range:input.range,values:v},cache:{storedAt:PUB?PUB.at:Date.now()}};}
 const RO={code:"read_only",message:"Đây là bản xem cho Tổng giám đốc, không sửa được."};
 function setRo(){if(ro)return;ro=true;document.body.classList.add("tgd-ro");setTimeout(bar,0);}
 const M={
  async callTool(srv,tool,input,opts){
   if(tool!=="get_values"){if(real&&live)return real.callTool(srv,tool,input,opts);throw RO;}
   if(real&&!ro){try{const r=await real.callTool(srv,tool,input,opts);live=true;rec(input,r);return r;}catch(e){await pubReady;if(!PUB||live)throw e;setRo();}}
   await pubReady;if(!ro)setRo();return fake(input);},
  watchTool(srv,tool,input,handler,opts){let stop=null;
   if(real&&!ro){stop=real.watchTool(srv,tool,input,ev=>{if(ev.type==="data"){live=true;rec(input,ev.result);handler(ev);}else if(!live){pubReady.then(()=>{if(PUB){setRo();handler({type:"data",result:fake(input)});}else handler(ev);});}else handler(ev);},opts);}
   else pubReady.then(()=>{setRo();handler({type:"data",result:fake(input)});});
   return ()=>{if(typeof stop==="function")stop();};},
  async invalidate(srv,tool,input){if(real&&live)return real.invalidate(srv,tool,input);}
 };
 async function mcp(c){let m=null;try{m=c&&c.use?await c.use("mcp"):null;}catch(e){m=null;}real=m;if(real)setTimeout(checkAll,2500);return M;}
 /* chủ app: đọc đủ các bảng cần để biết bản TGĐ đang xem có cũ không */
 async function checkAll(){if(!real||ro)return;for(const n of NEED){if(REC[K(n[0],n[1])])continue;try{await M.callTool("Google Sheets","get_values",{spreadsheetId:n[0],range:n[1]},{cache:false});}catch(e){return;}}bar();}
 function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+"."+s.length;}
 function full(){return NEED.every(n=>REC[K(n[0],n[1])]);}
 function curHash(){const o={};NEED.forEach(n=>{const k=K(n[0],n[1]);o[k]=REC[k];});return hash(JSON.stringify(o));}
 const fmt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())+" "+p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear();};
 function bar(){const el=document.getElementById("tgdbar");if(!el)return;
  if(ro){el.hidden=false;el.className="tgdbar ro";el.innerHTML=PUB?'<span>Bản xem chỉ đọc · số liệu lúc '+fmt(PUB.at)+'</span>':'<span><b>Chưa tải được số liệu</b> · '+(PUB_ERR==="bad_key"?"đường link thiếu hoặc sai mã truy cập":"kiểm tra mạng rồi tải lại trang")+'</span>';return;}
  if(!real||!live||!canPub||!full()){el.hidden=true;return;}

function capWarn(){const L=[];for(const k of Object.keys(RANGES)){const v=S.data[k];if(!v)continue;const m=/!([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec((S.rng&&S.rng[k])||RANGES[k]);if(!m)continue;const r0=+m[2],r1=+m[4],cap=r1-r0+1;const cols=RNAME[k][1];let last=0;v.forEach((r,i)=>{if(cols.some(c=>g(r,c).trim()!==""))last=i+1;});const free=cap-last;if(free<=Math.max(5,Math.round(cap*0.05)))L.push({k,name:RNAME[k][0],last:r0+last-1,end:r1,free});}return L;}
function watchAll(){Object.keys(RANGES).forEach(k=>{mcp.watchTool(SRV,"get_values",{spreadsheetId:SID,range:RANGES[k]},ev=>{
  if(ev.type==="data"){S.data[k]=vals(ev.result,k);S.err[k]=null;S.stamp[k]=(ev.result.cache&&ev.result.cache.storedAt)||Date.now();if(S.snap&&Object.keys(RANGES).every(x=>S.data[x]&&!S.err[x]&&S.stamp[x]!==S.snap.at))S.snap=null;snapQueue();}
  else{const c=ev.error&&ev.error.code;if(c==="bad_request"&&!S.fallback){S.fallback=true;loadAll();return;}if(DENY.includes(c)&&!S.snap)S.data[k]=undefined;S.err[k]=ev.error||{code:"upstream_error"};if(c==="approval_required")S.needApproval=true;snapFallback();}
  queue();},{cache:{staleTime:60000,gcTime:900000},refetchInterval:300000});});}
async function loadAll(){for(const k of Object.keys(RANGES)){try{const res=await mcp.callTool(SRV,"get_values",{spreadsheetId:SID,range:RANGES[k]},{cache:false});S.data[k]=vals(res,k);S.err[k]=null;S.stamp[k]=Date.now();}catch(e){S.err[k]=e;if(e&&DENY.includes(e.code)&&!S.snap)S.data[k]=undefined;if(e&&e.code==="approval_required"){S.needApproval=true;break;}}queue();}
 if(Object.keys(RANGES).every(k=>S.data[k]&&!S.err[k])){S.snap=null;snapQueue();}else snapFallback();}
async function approve(){S.needApproval=false;render();await loadAll();}
function needMcp(){if(!mcp)throw {code:"read_only"};}
async function fresh(range){needMcp();return vals(await mcp.callTool(SRV,"get_values",{spreadsheetId:SID,range},{cache:false}));}
async function put(range,row){needMcp();const r=await mcp.callTool(SRV,"update_formulas",{spreadsheetId:SID,range,formulas:[row]});logW(range,[row]);return r;}
/* Nhật ký: mỗi lần app ghi vào Sheet thì ghi thêm 1 dòng vào tab "Nhật ký app" (ai, lúc nào, trang, vùng ô, giá trị). Chạy nền, không làm chậm thao tác. */
let LOGQ=Promise.resolve(),WHO=null;
async function who(){if(WHO)return WHO;try{const c=window.claude,u=c&&c.use?await c.use("user"):null;if(u){const m=await u.me();WHO=[(m&&m.name)||"",m&&m.email?"<"+m.email+">":""].filter(Boolean).join(" ");}}catch(e){}return WHO||"(không rõ người dùng)";}
function nowVN(){const d=new Date(),p=n=>String(n).padStart(2,"0");return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}
function logW(range,rows){const at=nowVN(),view=(VIEWS.find(v=>v.id===S.view)||{name:S.view}).name;
 LOGQ=LOGQ.then(async()=>{try{const w=await who();const v=await fresh("'"+LOG_SHEET+"'!A4:A");const r=4+v.length;
  let val=JSON.stringify(rows);if(val.length>1500)val=val.slice(0,1500)+"…";
  await mcp.callTool(SRV,"update_formulas",{spreadsheetId:SID,range:"'"+LOG_SHEET+"'!A"+r+":E"+r,formulas:[["'"+at,txt(w),txt(view),"'"+range,"'"+val]]});}
 catch(e){if(!S.logErr){S.logErr=true;toast("Không ghi được nhật ký vào tab “"+LOG_SHEET+"”. Số liệu chính vẫn đã lưu.");}}});}
async function reload(){if(!mcp)return;if(S.fallback){loadAll();return;}try{await mcp.invalidate(SRV,"get_values")}catch(e){S.fallback=true;loadAll();}}
function errText(e,w){const c=e&&e.code;
 if(c==="read_only")return "Bạn đang xem bản chỉ xem nên không ghi được vào Sheet. Muốn sửa hoặc ghi sổ, mở thẳng file Google Sheet (nếu đã được chia sẻ).";
 if(c==="needs_reauth")return "Kết nối Google Sheets đã hết hạn. Vào Settings → Connectors trên claude.ai để kết nối lại.";
 if(c==="server_not_connected")return "Chưa có kết nối Google Sheets. Thêm Google Sheets trong Settings → Connectors trên claude.ai, rồi bấm tải lại.";
 if(c==="selection_required")return "Bạn có nhiều kết nối Google Sheets. Chọn một khi claude.ai hỏi, rồi tải lại.";
 if(c==="approval_required")return w?"Lần ghi này cần bạn cho phép. Bấm lưu lại và chọn Cho phép.":"Cần bạn cho phép app đọc Google Sheets.";
 if(c==="not_in_manifest")return "App đang bị tắt quyền dùng Google Sheets. Bật lại trong mục Quyền của app.";
 if(c==="blocked_by_policy")return "Tổ chức của bạn đang chặn công cụ Google Sheets này.";
 if(c==="tool_error")return "Google Sheets báo lỗi: "+((e&&e.message)||"không rõ")+".";
 if(c==="moved")return e.message;
 if(c==="server_unavailable"||c==="upstream_error")return w?"Mạng chậm, chưa chắc đã ghi vào Sheet. Bấm tải lại để kiểm tra trước khi ghi lại.":"Google Sheets chưa phản hồi. Đang giữ số liệu lần trước.";
 return (e&&e.message)||"Có lỗi không rõ.";}

 if(S.snap)return '<div class="msg"><b>Bản chỉ xem · số liệu lúc '+esc(fmtAt(S.snap.at))+'</b><span>Bản này tự cập nhật mỗi khi chủ app mở app. Bạn xem được mọi màn hình nhưng không ghi được vào Sheet. Muốn sửa hoặc ghi sổ, mở thẳng file Google Sheet (nếu đã được chia sẻ).</span><div><a class="btn sm" href="'+SHEET_URL+'" target="_blank" rel="noopener">Mở Google Sheet</a></div></div>';

function pack(rs){// rs: radii (sorted desc). greedy front placement
 const P=[];const ok=(x,y,r)=>P.every(q=>Math.hypot(q.x-x,q.y-y)>=q.r+r+3-1e-6);
 rs.forEach((r,i)=>{if(!i){P.push({x:0,y:0,r});return;}if(i===1){P.push({x:P[0].r+r+3,y:0,r});return;}
  let best=null;for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const A=P[a],B=P[b],ra=A.r+r+3,rb=B.r+r+3,dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d>ra+rb||d<Math.abs(ra-rb)||!d)continue;const l=(ra*ra-rb*rb+d*d)/(2*d),h=Math.sqrt(Math.max(0,ra*ra-l*l));[1,-1].forEach(sg=>{const x=A.x+l*dx/d+sg*h*dy/d,y=A.y+l*dy/d-sg*h*dx/d;if(ok(x,y,r)){const sc=Math.hypot(x,y*1.35);if(!best||sc<best.sc)best={x,y,sc};}});}
  if(!best){const R=Math.max(...P.map(q=>Math.hypot(q.x,q.y)+q.r))+r+3;best={x:R,y:0};}P.push({x:best.x,y:best.y,r});});return P;}

function bubbles(rows){const V=rows.filter(r=>r.gt>0).sort((a,b)=>b.gt-a.gt),N=rows.filter(r=>!(r.gt>0));if(!V.length)return '<div class="empty">Chưa có hợp đồng nào có giá trị.</div>';

/* ---------- ĐIỀU HÀNH (CEO): 5 câu hỏi, chỉ đọc ---------- */
function ceoProfit(){const T=TQ(),H=HD(),P=TP(),Q=QTDA();if(!T)return [];
 return T.rows.map(t=>{const h=H.find(x=>x.ma===t.ma)||{},q=Q.find(x=>x.ma===t.ma)||{};
  const gtTruoc=h.gtTruoc||0,tpTruoc=P.filter(x=>x.hd===t.ma).reduce((s,x)=>s+x.gtTruoc,0);
  const ns=q.hasNs?q.ns:null,laiNs=ns!=null?gtTruoc-tpTruoc-ns:null,lai=num(t.lai);
  const base=laiNs!=null?laiNs:lai,bien=gtTruoc>0?base/gtTruoc:null;
  const vuot=ns!=null&&ns>0&&t.cp>ns*(1+(q.nguong||0.1)),use=ns?t.cp/ns:null;
  const risk=base<0?"Lỗ dự kiến":vuot?"Vượt ngân sách":(ns!=null&&use>1)?"Sát ngân sách":ns==null?"Chưa có ngân sách":bien!=null&&bien<0.1?"Biên lãi thấp":"";
  return {ma:t.ma,gt:t.gt,gtTruoc,tpTruoc,cp:t.cp,ns,lai,laiNs,base,bien,risk,gdda:q.gdda||"",thu:t.thu};}).filter(x=>x.gt>0).sort((a,b)=>(a.bien==null?9:a.bien)-(b.bien==null?9:b.bien));}
/* Kiểm tra số liệu trong Sheet: những chỗ làm các báo cáo lệch nhau nếu không sửa */
function dataChecks(){const L=[],O=DOT(),H=HD(),TPs=TP(),Q=DTP(),SOr=SO(),t0=d0(new Date());
 const cnt={};O.forEach(o=>{if(o.ma)cnt[o.ma]=(cnt[o.ma]||0)+1;});Object.entries(cnt).filter(e=>e[1]>1).forEach(([k,c])=>{const o=O.find(x=>x.ma===k);L.push({a:"Mã đợt CĐT bị trùng · "+k,b:c+" dòng cùng mã trong tab Đợt CĐT. Sổ thu chi và thầu phụ gắn theo mã đợt nên không biết dòng nào — đặt lại mã riêng cho từng đợt.",ma:o&&o.hd});});
 H.filter(h=>h.gtSau>0&&Math.abs(h.lech)>1).forEach(h=>L.push({a:"Lịch đợt CĐT lệch giá trị HĐ · "+kxName(h.ma),b:"Tổng lịch "+vnd(h.lich)+" / HĐ "+vnd(h.gtSau),ma:h.ma}));
 H.filter(h=>!(h.gtSau>0)).forEach(h=>L.push({a:"Thiếu giá trị hợp đồng · "+kxName(h.ma),b:h.cdt||"Chưa có chủ đầu tư",ma:h.ma}));
 TPs.filter(c=>Math.abs(c.lech)>1).forEach(c=>{const s=Q.filter(d=>d.hdtp===c.ma).reduce((a,d)=>a+d.phai,0);L.push({a:"Lịch đợt thầu phụ lệch giá trị HĐ · "+c.ten,b:c.ma+": HĐ "+vnd(c.gt)+", cộng các đợt "+vnd(s)+" ("+(s>c.gt?"thừa ":"thiếu ")+vnd(Math.abs(s-c.gt))+")",ma:c.hd});});
 tpChecks().forEach(x=>L.push({a:"Lỗi đợt thầu phụ · "+x.d.ma,b:x.why,ma:DTPhd(x.d)}));
 DN().filter(x=>x.con<-1000).forEach(x=>L.push({a:"Thu dư so với hồ sơ · "+kxName(x.hd)+" lần "+x.lan,b:"Đã thu "+vnd(x.thu)+" / đề nghị "+vnd(x.gt),ma:x.hd}));
 SOr.forEach(x=>{const d=dmy(x.ngay);if(!d)L.push({a:"Sổ thu chi dòng "+x.r+" chưa có ngày hợp lệ",b:x.loai+" "+vnd(x.tien)+" — không được tính vào báo cáo theo kỳ",ma:x.hd});else if(d>t0)L.push({a:"Sổ thu chi dòng "+x.r+" ghi ngày tương lai "+x.ngay,b:x.loai+" "+vnd(x.tien),ma:x.hd});
  if(/^Thu CĐT/i.test(x.loai)&&!x.hd)L.push({a:"Sổ thu chi dòng "+x.r+" thu CĐT chưa gắn hợp đồng",b:vnd(x.tien)+" · "+(x.dt||""),ma:""});
  if(/thầu phụ/i.test(x.loai)&&!x.hd)L.push({a:"Sổ thu chi dòng "+x.r+" chi thầu phụ chưa gắn hợp đồng",b:vnd(x.tien)+" · "+(x.dt||""),ma:""});});
 return L;}
/* ---------- SỐ LIỆU DÙNG CHUNG cho Điều hành và Báo cáo quản trị ----------
 Một định nghĩa cho mỗi chỉ số:
 · Lãi gộp (trước VAT) = HĐ CĐT − HĐ thầu phụ − chi phí dự án đã ghi Sổ (cột Lãi của tab Tổng quan). Dự án chưa có HĐ thầu phụ → "chưa đủ số liệu".
 · Dòng tiền sắp tới = dự báo của tab Kế hoạch (cashFc).
 · Tiền CĐT chưa thu chia 3 loại: Đủ điều kiện, chưa đòi / Đã gửi, chờ CĐT trả / Chưa đến điều kiện. */
function projRows(){const T=TQ();if(!T)return [];const PR=ceoProfit();
 return T.rows.filter(r=>r.gt>0).map(r=>{const h=hdInfo(r.ma),p=PR.find(x=>x.ma===r.ma)||{},dat=hdProg(r.ma).dat,thu=r.thu/r.gt;
  const base=h.gtTruoc||r.gt/(1+(h.vat>0?h.vat:0.08)),known=String(r.lai).trim()!=="",lai=num(r.lai),noTP=!r.gtTP,laiOk=known&&!noTP,laiPc=base?lai/base:null;
  const flags=[];
  if(p.risk==="Lỗ dự kiến"||p.risk==="Vượt ngân sách")flags.push(["bad",p.risk]);
  if(laiOk&&laiPc!=null&&laiPc<0)flags.push(["bad","Lỗ"]);else if(laiOk&&laiPc!=null&&laiPc<0.2)flags.push(["out","Lãi gộp thấp"]);
  if(dat!=null&&dat-thu>0.15)flags.push(["out","Làm nhiều, thu ít"]);
  if(noTP)flags.push(["","Chưa có HĐ thầu phụ"]);
  const sc=flags.reduce((s,f)=>s+(f[0]==="bad"?4:f[0]==="out"?2:0),0);
  return {ma:r.ma,name:kxName(r.ma),gt:r.gt,dat,thu,lai,laiPc,laiOk,noTP,flags,sc,r};}).sort((a,b)=>b.sc-a.sc||b.gt-a.gt);}

/* Phải trả thầu phụ theo tuổi nợ (quy định trả trong TP_HAN ngày sau khi CĐT trả) */
function apStats(){const by={},tot={cho:0,trong:0,q1:0,q2:0,q3:0,unk:0};
 DTP().forEach(d=>{const han=Math.max(0,d.han),rest=Math.max(0,d.con-han),a=tpAge(d),k=(d.ten||"").trim()||"(chưa có tên)";

function nsMap(){const m={};QTDA().forEach(q=>String(q.hr||"").split(/[,;\s]+/).filter(Boolean).forEach(c=>{m[c.toUpperCase()]=q.ma;}));return m;}
function nsCode(s){return String(s||"").split("-")[0].trim().toUpperCase();}
function nsProjects(){const t0=d0(new Date()),soon=addD(t0,14),back=addD(t0,-30),ym=nsMonth(),M=nsMap(),P={};
 const get=(code,ten)=>{const hd=M[code]||"",k=hd?"hd:"+hd:"hr:"+code;if(!P[k])P[k]={k,hd,codes:new Set(),ten:"",now:[],next:[],recent:[],ot:0,otN:0,otBy:{}};const p=P[k];if(code)p.codes.add(code);if(!p.ten&&ten)p.ten=ten.trim();return p;};
 NS_TASK().forEach(x=>{if(x.kt<back||x.bd>soon)return;const c=(x.ma||"").toUpperCase();if(!c)return;const p=get(c,x.da);
  if(x.bd<=t0&&x.kt>=t0)p.now.push(x);else if(x.bd>t0)p.next.push(x);else p.recent.push(x);});
 NS_TC().forEach(x=>{if(!nsInMonth(x.d,ym))return;const c=nsCode(x.da);if(!c)return;const p=get(c,String(x.da).replace(/^[^-]*-/,""));p.ot+=x.gio;p.otN++;p.otBy[x.key]=(p.otBy[x.key]||{ten:x.ten,h:0});p.otBy[x.key].h+=x.gio;});
 QTDA().forEach(q=>{if(q.hr&&!P["hd:"+q.ma]){const p=get(String(q.hr).split(/[,;\s]+/)[0].toUpperCase(),"");}});
 const L=Object.values(P).map(p=>{const ppl={};const add=(x,w)=>{const k=x.key;(ppl[k]=ppl[k]||{ten:x.nguoi,now:0,next:0,recent:0})[w]++;};p.now.forEach(x=>add(x,"now"));p.next.forEach(x=>add(x,"next"));p.recent.forEach(x=>add(x,"recent"));
  p.ppl=Object.values(ppl).sort((a,b)=>b.now-a.now||b.next-a.next||b.recent-a.recent);p.nNow=p.ppl.filter(x=>x.now).length;p.nNext=p.ppl.filter(x=>!x.now&&x.next).length;
  p.name=p.hd?kxName(p.hd):(p.ten||[...p.codes][0]);return p;});
 return L.sort((a,b)=>(b.hd?1:0)-(a.hd?1:0)||b.nNow-a.nNow||b.now.length-a.now.length||b.ot-a.ot);}

 if(p.recent.length){const inner=p.recent.sort((a,b)=>b.kt-a.kt).slice(0,15).map(nsTaskLine).join("")+(p.recent.length>15?'<p class="sub">… và '+(p.recent.length-15)+' việc khác</p>':'');h+=noHead?'<details class="ns-ps ns-more"><summary><h3>Đã kết thúc trong 30 ngày · '+p.recent.length+' việc <span class="sub">(bấm để xem)</span></h3></summary>'+inner+'</details>':'<div class="ns-ps"><h3>Đã kết thúc trong 30 ngày · '+p.recent.length+' việc</h3>'+inner+'</div>';}

 return h+'</div>'+(noHead?'</div>':'</details>');}

 return {code,head,T};}

 (S.ns.data.droplist||[]).forEach(r=>{const d=g(r,1).trim(),mm=/^(\d+)_(.+)$/.exec(d);if(!mm)return;put(mm[1],mm[2].trim(),{leader:g(r,9).trim(),email:(g(r,11)||g(r,10).split(";")[0]||"").trim(),inDrop:true});});
 NS_NV().forEach(v=>{const mm=/^(\d+)_(.+)$/.exec(v.ten.trim());const ma=mm?mm[1]:"",ten=mm?mm[2].trim():nsShow(v.ten);const ex=[...m.values()].find(p=>p.ma===ma||nsKey(p.ten)===nsKey(ten));put(ex?ex.ma:ma,ex?ex.ten:ten,{vao:v.vao,phep:v.tong,inPhep:true});});
 TG().forEach(t=>{const ex=[...m.values()].find(p=>(t.ma&&p.ma===t.ma)||nsKey(p.ten)===nsKey(t.ten));if(ex){ex.tg=t;}else put(t.ma,t.ten,{tg:t});});

 const L=STAFF_WK(),A={},last=n=>n.split(" ").pop().toLowerCase();
 L.forEach(p=>{if(p.tg&&p.tg.al.length)p.tg.al.forEach(a=>{A[a.toLowerCase()]=p.ten;});});
 L.forEach(p=>{if(p.tg&&p.tg.al.length)return;const dup=L.filter(x=>last(x.ten)===last(p.ten)).length>1;const a=(dup?p.ten.split(" ").slice(-2).join(" "):p.ten.split(" ").pop()).toLowerCase();if(!A[a])A[a]=p.ten;});
 L.forEach(p=>{A[p.ten.toLowerCase()]=p.ten;});

  /* bỏ tên gọi này khỏi người khác (một tên gọi chỉ thuộc một người) */
  for(const o of STAFF()){if(o.ten!==ten&&o.tg&&o.tg.al.some(a=>a.toLowerCase()===alias.toLowerCase())){await put("'"+TG_SHEET+"'!C"+o.tg.r,[txt(o.tg.al.filter(a=>a.toLowerCase()!==alias.toLowerCase()).join(", "))]);}}

function lnJd(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd;}
function lnNewMoon(k,tz){const T=k/1236.85,T2=T*T,T3=T2*T,dr=Math.PI/180;let Jd1=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;Jd1+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*dr);const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,Mpr=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3;let C1=(0.1734-0.000393*T)*Math.sin(M*dr)+0.0021*Math.sin(2*dr*M);C1=C1-0.4068*Math.sin(Mpr*dr)+0.0161*Math.sin(dr*2*Mpr);C1=C1-0.0004*Math.sin(dr*3*Mpr);C1=C1+0.0104*Math.sin(dr*2*F)-0.0051*Math.sin(dr*(M+Mpr));C1=C1-0.0074*Math.sin(dr*(M-Mpr))+0.0004*Math.sin(dr*(2*F+M));C1=C1-0.0004*Math.sin(dr*(2*F-M))-0.0006*Math.sin(dr*(2*F+Mpr));C1=C1+0.0010*Math.sin(dr*(2*F-Mpr))+0.0005*Math.sin(dr*(2*Mpr+M));const deltat=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;return Math.floor(Jd1+C1-deltat+0.5+tz/24);}
function lnSun(jdn,tz){const T=(jdn-2451545.5-tz/24)/36525,T2=T*T,dr=Math.PI/180,M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;let DL=(1.914600-0.004817*T-0.000014*T2)*Math.sin(dr*M);DL=DL+(0.019993-0.000101*T)*Math.sin(dr*2*M)+0.000290*Math.sin(dr*3*M);let L=(L0+DL)*dr;L=L-Math.PI*2*Math.floor(L/(Math.PI*2));return Math.floor(L/Math.PI*6);}
function lnM11(yy,tz){const off=lnJd(31,12,yy)-2415021,k=Math.floor(off/29.530588853);let nm=lnNewMoon(k,tz);if(lnSun(nm,tz)>=9)nm=lnNewMoon(k-1,tz);return nm;}
function lnLeapOff(a11,tz){const k=Math.floor((a11-2415021.076998695)/29.530588853+0.5);let last=0,i=1,arc=lnSun(lnNewMoon(k+i,tz),tz);do{last=arc;i++;arc=lnSun(lnNewMoon(k+i,tz),tz);}while(arc!==last&&i<14);return i-1;}
function lunar(dd,mm,yy){const tz=7,dn=lnJd(dd,mm,yy),k=Math.floor((dn-2415021.076998695)/29.530588853);let ms=lnNewMoon(k+1,tz);if(ms>dn)ms=lnNewMoon(k,tz);let a11=lnM11(yy,tz),b11=a11,ly;if(a11>=ms){ly=yy;a11=lnM11(yy-1,tz);}else{ly=yy+1;b11=lnM11(yy+1,tz);}const ld=dn-ms+1,diff=Math.floor((ms-a11)/29);let lm=diff+11,leap=0;if(b11-a11>365){const lo=lnLeapOff(a11,tz);if(diff>=lo){lm=diff+10;if(diff===lo)leap=1;}}if(lm>12)lm-=12;if(lm>=11&&diff<4)ly-=1;return [ld,lm,ly,leap];}

let XLJS=null;

 catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rate_limited"?"Đang có một hộp thoại tải file, thử lại sau giây lát.":"Không tải được file ("+(e&&e.code||"lỗi")+").");}}

 const wb=new E.Workbook();wb.creator="HBA Quản trị";const ws=wb.addWorksheet("Lịch nghỉ "+String(M).padStart(2,"0")+"-"+Y,{pageSetup:{orientation:"landscape",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0}});

/* ---------- DỰ BÁO DÒNG TIỀN 8 TUẦN ----------
 Thu: hồ sơ đã gửi chưa thu đủ → theo "Hạn CĐT phải trả"; không có hạn → ngày gửi + số ngày CĐT phải trả trong HĐ (ngày làm việc ≈ ×7/5), không có → +30 ngày.
      Hồ sơ đã lập chưa gửi → giả định gửi trong 7 ngày rồi cộng hạn như trên. Khoản đã quá hạn không đưa vào tuần nào (không đoán được ngày thu).
 Chi: đợt thầu phụ đến hạn chưa chi → tuần này. Phần còn lại chờ CĐT trả → cùng tuần dự kiến thu hồ sơ CĐT tương ứng (+3 ngày).
      Cộng chi cố định mỗi tháng do người xem nhập (lương, thuê VP, lãi vay...) chia đều theo tuần. */
function d0(x){const d=new Date(x);d.setHours(0,0,0,0);return d;}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function wkStart(d){const x=d0(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function ddm(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");}
function addM(d,k){const y=d.getFullYear(),m=d.getMonth()+k,day=d.getDate(),last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last));}
function KH(){return (S.data.kh||[]).map((r,i)=>({r:i+4,ngay:g(r,0),d:dmy(g(r,0)),loai:g(r,1),muc:g(r,2),hd:g(r,3),dot:g(r,4),dt:g(r,5),tien:num(r[6]),nd:g(r,7),lap:/^Có/i.test(g(r,8)),tt:g(r,9)||"Dự kiến",nguoi:g(r,10),luc:g(r,11),tk:g(r,12).trim()})).filter(x=>(x.loai==="Thu"||x.loai==="Chi")&&x.tien>0);}
function payDays(hd){const r=(S.data.hd||[]).find(r=>g(r,0)===hd),n=num(r&&r[23]);return n>0?Math.ceil(n*7/5):30;}
function cashFc(N0){const T0=wkStart(new Date()),today0=d0(new Date()),N=N0||8;
 const W=[...Array(N)].map((_,i)=>({a:addD(T0,i*7),b:addD(T0,i*7+6),thu:0,chi:0,fix:0,it:[]}));
 const end=addD(T0,N*7);const wi=d=>{const i=Math.floor((d-T0)/864e5/7);return i<0?0:i;};
 const R={W,od:[],odSum:0,odChi:0,after:{thu:0,chi:0},noDate:0,assumed:0,autoThu:0,autoChi:0};
 const exp={};W.forEach(w=>w.cat={});
 const push=(w,it)=>{w.it.push(it);w.cat[it.cat]=(w.cat[it.cat]||0)+it.v;if(it.k==="in")w.thu+=it.v;else w.chi+=it.v;if(!it.plan&&it.cat!=="Chi cố định khác"){if(it.k==="in")R.autoThu+=it.v;else R.autoChi+=it.v;}};
 const dotHs={};DOT().forEach(o=>{if(o.ma)dotHs[o.ma]=o.hs;});
 /* kế hoạch nhập tay: khoản gắn đợt CĐT / đợt thầu phụ thay cho phần tự tính của đợt đó */
 const KP=KH().filter(x=>x.tt!=="Hủy"&&x.tt!=="Đã xong"&&x.d),planHs={},planDtp={};
 KP.forEach(p=>{if(p.lap||!p.dot)return;if(p.loai==="Thu"&&dotHs[p.dot])planHs[dotHs[p.dot]]=(planHs[dotHs[p.dot]]||0)+p.tien;if(p.loai==="Chi"&&p.muc==="Thầu phụ")planDtp[p.dot]=(planDtp[p.dot]||0)+p.tien;});
 DN().filter(x=>x.con-(planHs[x.ma]||0)>1).forEach(x0=>{const x=Object.assign({},x0,{con:x0.con-(planHs[x0.ma]||0)});let d,note,ass=false;const unsent=x.tt==="Chưa gửi CĐT"||!dmy(x.gui);
  if(!unsent&&dmy(x.han)){d=dmy(x.han);note="hạn "+x.han;}
  else if(!unsent){const t0=d0(new Date()),b=dmy(x.hdon)||t0;d=addD(b<t0&&!x.hdon?t0:b,payDays(x.hd));note=x.hdon?"HĐ VAT "+x.hdon+", ước hạn":"chưa xuất HĐ VAT, giả định xuất ngay";ass=true;}
  else{d=addD(today0,7+payDays(x.hd));note="chưa gửi CĐT — giả định gửi trong 7 ngày";ass=true;}
  if(!unsent&&d<today0){R.od.push(x);R.odSum+=x.con;exp[x.ma]="od";return;}
  exp[x.ma]=d;if(ass)R.assumed+=x.con;
  if(d>=end){R.after.thu+=x.con;return;}
  push(W[wi(d)],{k:"in",cat:"Thu CĐT",hs:x.ma,d,a:shortName(x.hd)+" · lần "+x.lan,b:(hdInfo(x.hd).cdt||"").replace(/^CÔNG TY (CỔ PHẦN|TNHH)\s*/i,"")+" · "+note,v:x.con,ma:x.hd,ass});});
 KP.forEach(p=>{if(p.loai==="Thu"&&p.dot&&!p.lap&&dotHs[p.dot])exp[dotHs[p.dot]]=p.d<today0?today0:p.d;});
 /* đợt CĐT chưa có hồ sơ nhưng đã có "Ngày dự kiến thu" (cột AC) → đưa vào dự báo; đợt đã có khoản kế hoạch nhập tay thì bỏ qua */
 const KPdot=new Set(KP.map(p=>p.dot).filter(Boolean));
 DOT().forEach(o=>{if(o.hs||o.con<=1||KPdot.has(o.ma))return;const d1=dmy(o.dkthu);if(!d1)return;const d=d1<today0?today0:d1;exp["dot:"+o.ma]=d;R.assumed+=o.con;if(d>=end){R.after.thu+=o.con;return;}
  push(W[wi(d)],{k:"in",cat:"Thu CĐT",dot:o.ma,d,a:shortName(o.hd)+" · đợt "+o.so,b:"chưa lập hồ sơ · dự kiến thu "+o.dkthu,v:o.con,ma:o.hd,ass:true});});
 DTP().forEach(t=>{const hd=DTPhd(t);let P=planDtp[t.ma]||0;const h0=Math.max(0,t.han),uH=Math.min(P,h0),han=h0-uH;P-=uH;
  if(han>1)push(W[0],{k:"out",cat:"Thầu phụ",dtp:t.ma,d:today0,a:t.ten+" · đợt "+t.so,b:"Đã đến hạn, chưa chi",v:han,ma:hd});
  const rest0=t.con-h0,uR=Math.min(P,Math.max(0,rest0)),rest=rest0-uR;P-=uR;if(planDtp[t.ma]!=null)planDtp[t.ma]=P;if(rest<=1||/^Có/i.test(t.duyet))return;
  const hs=dotHs[t.dcdt],e=hs?exp[hs]:exp["dot:"+t.dcdt];
  if(e==="od"){R.odChi+=rest;return;}
  if(!(e instanceof Date)){R.noDate+=rest;return;}

function khIsoD(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null;}

 else if(f.k==="quy"){a=new Date(f.y,(f.q-1)*3,1);b=new Date(f.y,f.q*3,0);lab="Quý "+f.q+"/"+f.y;key="q:"+f.y+"-"+f.q;}
 else if(f.k==="nam"){a=new Date(f.y,0,1);b=new Date(f.y,11,31);lab="Năm "+f.y;key="y:"+f.y;}
 else{a=new Date(f.y,f.m-1,1);b=new Date(f.y,f.m,0);lab="Tháng "+f.m+"/"+f.y;key="m:"+f.y+"-"+String(f.m).padStart(2,"0");}
 return {a,b,lab,key,k:f.k};}

function SODN(){return (S.data.sodn||[]).map((r,i)=>({r:i+4,so:g(r,1).trim(),ngay:g(r,2),dv:g(r,3),tien:num(r[4]),hs:g(r,5).trim()})).filter(x=>x.so);}
function soSuffix(hd){const L=SODN().filter(x=>x.hs&&x.hs.indexOf(hd+"-L")===0);if(L.length){const m=/\/([^/]+)$/.exec(L[L.length-1].so);if(m&&!/ĐNTT/.test(m[1]))return m[1];}const c=hd.split("_").slice(2).join("_");return c||"HBA";}
function nextSo(hd){const y=new Date().getFullYear();let mx=0;SODN().forEach(x=>{const m=/^(\d+)\/(\d{4})\//.exec(x.so);if(m&&+m[2]===y)mx=Math.max(mx,+m[1]);});return String(mx+1).padStart(2,"0")+"/"+y+"/HBA-ĐNTT/"+soSuffix(hd);}

 return so;}

function docSo(n){n=Math.round(Math.abs(n));if(!n)return "Không đồng.";const cs=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
 const doc3=(x,full)=>{const tr=Math.floor(x/100),ch=Math.floor(x%100/10),dv=x%10,r=[];if(full||tr)r.push(cs[tr]+" trăm");
  if(ch>1){r.push(cs[ch]+" mươi");if(dv===1)r.push("mốt");else if(dv===4)r.push("tư");else if(dv===5)r.push("lăm");else if(dv)r.push(cs[dv]);}

 else{if(!f.hd)return "Chọn hợp đồng chủ đầu tư.";if(!f.tpn.trim())return "Chọn thầu phụ.";if(!dts.includes(f.tpn.trim()))return "“"+f.tpn+"” chưa có trong Danh mục. Bấm “thêm vào Danh mục” dưới ô thầu phụ.";if(!f.pv.trim())return "Nhập phạm vi công việc.";}

 const vt=parseFloat(String(f.vat).replace(",","."));if(isNaN(vt)||vt<0||vt>20)return "Thuế suất VAT từ 0 đến 20%.";

async function saveDot(r){const x=DOT().find(d=>d.r===r);if(!x)return;const v=id=>(document.getElementById(id)||{}).value||"";
 const lan=v("e-lan").trim(),gui=v("e-gui"),dk=v("e-dk"),shd=v("e-shd").trim(),nhd=v("e-nhd"),loai=v("e-loai")||x.loai,dk2=v("e-dk2").trim(),gt=Math.round(num(v("e-gt"))),kt=Math.round(num(v("e-kt"))),tuv=Math.round(num(v("e-tuv"))),gc=v("e-gc").trim();
 if(!(gt>0)){toast("Giá trị đợt phải lớn hơn 0");return;}if(!dk2){toast("Nhập điều kiện thanh toán");return;}
 if(lan&&!(+lan>=1&&+lan<=99)){toast("Lần đề nghị phải từ 1 đến 99");return;}
 S.busy=true;render();
 try{const c=await fresh("'Đợt CĐT'!A"+r);if(!(c[0]&&c[0][0]===x.ma))throw {code:"moved",message:"Dòng trong Sheet vừa thay đổi. Bấm tải lại rồi làm lại."};
  const jobs=[];
  if(lan!==x.lan||gui!==isoVN(x.gui))jobs.push(["'Đợt CĐT'!D"+r+":E"+r,[lan?+lan:"",dateF(gui)]]);
  if(loai!==x.loai||dk2!==x.dk||gt!==Math.round(x.gt)||kt!==Math.round(x.kt))jobs.push(["'Đợt CĐT'!F"+r+":I"+r,[loai,txt(dk2),gt,kt||""]]);
  if(gc!==x.gc)jobs.push(["'Đợt CĐT'!K"+r,[txt(gc)]]);
  if(tuv!==Math.round(x.tuv))jobs.push(["'Đợt CĐT'!V"+r,[tuv||""]]);
  if(dk!==isoVN(x.ngaydk))jobs.push(["'Đợt CĐT'!J"+r,[dateF(dk)]]);
  if(shd!==x.shd||nhd!==isoVN(x.nhd))jobs.push(["'Đợt CĐT'!T"+r+":U"+r,[txtKeep(shd),dateF(nhd)]]);
  for(const j of jobs)await put(j[0],j[1]);
  let soNew="";if(lan&&gui){const ma2=x.hd+"-L"+String(+lan).padStart(2,"0"),ex=DN().find(n=>n.ma===ma2);if(!(ex&&ex.so)&&!x.soCap){const mem=DOT().filter(d=>d.r===x.r||d.hs===ma2);soNew=await issueSo(ma2,"",gui,mem);}else if(ex&&ex.so&&!x.soCap)await put("'Đợt CĐT'!X"+r,[txt(ex.so)]);}

 S.busy=false;render();}

document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.classList&&ev.target.classList.contains("qin")){ev.preventDefault();runQuick(ev.target.value);return;}if(ev.key==="Escape"&&!document.getElementById("printRoot").hidden){closePrint();return;}if(ev.key==="Escape"&&S.sheet&&!S.busy){S.sheet=null;render();}if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches('[role="button"]')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}});
document.addEventListener("toggle",ev=>{const t=ev.target;if(t&&t.classList&&t.classList.contains("cfw")){if(t.open)S.cfOpen=+t.dataset.cfi;else if(S.cfOpen===+t.dataset.cfi)S.cfOpen=null;}},true);
 document.addEventListener("change",ev=>{const id=ev.target.id;
  if(id==="cf-bal"){const v=String(ev.target.value).trim();S.cfBal=v===""?null:num(v);ls.set("hba.cfBal",v===""?"":String(S.cfBal));render();return;}
  if(id==="cf-fix"){S.cfFix=num(ev.target.value);ls.set("hba.cfFix",String(S.cfFix||""));render();return;}
  if(/^k-/.test(id)&&S.sheet&&S.sheet.type==="kh"){khChange(id);return;}
 if(id==="vxH"){S.vxH=ev.target.value;render();return;}
 if(id==="hsH"){S.hsH=ev.target.value;render();return;}
 if(id==="selHD"){S.hd=ev.target.value;ls.set("hba.hd",S.hd);render();}
 else if(id==="selTP"){S.tp=ev.target.value;ls.set("hba.tp",S.tp);render();}
 else if(/^(n|d)-/.test(id)&&S.nf&&document.getElementById("nfrm")){nfChanged(id);}
 else if(/^q-/.test(id)&&S.sheet&&S.sheet.v&&/^(dota|dtpa|dtpe)$/.test(S.sheet.type)){qRead();const sv=S.sheet.v,b=dotFormBase(S.sheet);if(id==="q-pct"&&b&&sv.pct!=="")sv.gt=String(Math.round(b*parseFloat(sv.pct)/100));if(id==="q-gt")sv.pct=b&&num(sv.gt)?String(Math.round(num(sv.gt)/b*10000)/100):"";if(["q-pct","q-gt"].includes(id))render();}
 else if(ev.target.classList&&ev.target.classList.contains("hs-chk")&&S.sheet&&S.sheet.type==="hse"){qRead();hsReadSel();render();}
 else if(/^q-/.test(id)&&S.sheet&&S.sheet.type==="hse"){qRead();hsReadSel();if(id==="q-lan")render();}
 else if(/^q-/.test(id)&&S.sheet&&S.sheet.v&&/^(hde|tpe)$/.test(S.sheet.type)){qRead();if(["q-gt","q-vat","q-pl","q-cdt","q-tpn"].includes(id))render();}
 else if(/^q-/.test(id)&&S.sheet&&S.sheet.v){qRead();if(["q-cdt","q-tpn","q-ten","q-ngay","q-dot"].includes(id))render();}
 else if(id==="f-hd"){readF();S.f.ct="";S.f.tpn="";S.f.dt=S.f.kind==="thu"?(hdInfo(S.f.hd).cdt||""):"";S.f.tien="";S.f.nd="";render();}
});
document.addEventListener("input",ev=>{if(ev.target.classList&&ev.target.classList.contains("qin"))S.qtext=ev.target.value;if(ev.target.id==="dm-q"){S.dmq=ev.target.value;render();}});
document.addEventListener("focusout",ev=>{if(ev.target.classList&&ev.target.classList.contains("money-in")&&ev.target.id!=="f-tien"){const n=num(ev.target.value);ev.target.value=n?vnd(n):"";}if(ev.target.id==="f-tien"){const n=num(ev.target.value);S.f.tien=n?String(n):"";ev.target.value=n?vnd(n):"";}});
document.addEventListener("submit",ev=>{if(ev.target.id==="frm"){ev.preventDefault();submit();}if(ev.target.id==="nfrm"){ev.preventDefault();readNF();const e=nfCheck();S.nf.err=e;saveDraft();if(e){render();return;}S.sheet={type:"nf"};render();}});
document.getElementById("refresh").addEventListener("click",()=>{if(S.role!=="kt"){S.wk.tried=false;S.wk.data=null;}if(S.role==="gd"){S.plan.tabs={};S.plan.err={};S.plan.sum=null;}if((S.role==="ns"||S.role==="gd"||S.role==="pc")&&mcp){S.ns.tried=false;nsLoad();}if(!mcp||S.snap){toast("Đang tải bản xem mới nhất…");snapLoad();return;}toast("Đang tải lại từ Google Sheet…");reload();});
let RZ;window.addEventListener("resize",()=>{clearTimeout(RZ);RZ=setTimeout(()=>{if(S.view==="tong-hop")render(true);},250);});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if((VIEWS.some(v=>v.id===h)||h==="hd-moi"||h==="danh-muc"||h==="viec-xong")&&h!==S.view){S.view=h;render();}});

(function init(){const h=location.hash.slice(1);if(VIEWS.some(v=>v.id===h)||h==="hd-moi"||h==="danh-muc"||h==="viec-xong")S.view=h;try{const d=JSON.parse(ls.get("hba.nf")||"null");if(d&&d.dots)S.nf=d;}catch(e){}render();
 const c=window.claude;if(!c||!c.use){BR.mcp(null).then(m=>{mcp=m;watchAll();render();});return;}
 BR.mcp(c).then(m=>{mcp=m;watchAll();render();});})();
})();
